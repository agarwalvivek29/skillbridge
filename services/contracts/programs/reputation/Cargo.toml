[package]
name = "reputation"
version = "0.1.0"
description = "SkillBridge Reputation Program - On-chain reputation tracking for freelancers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reputation"

[features]
default = ["cpi"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["metadata"] }

[dev-dependencies]
anchor-client = "0.29.0"
solana-program-test = "1.17.0"
solana-sdk = "1.17.0"
